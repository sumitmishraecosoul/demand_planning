# Nginx — Demand Planning on ecosoulhometech.com (subdomains, Mac Studio + Homebrew)
#
# Frontend: https://demand-planning.ecosoulhometech.com
# API:      https://api.demand-planning.ecosoulhometech.com
#
# Copy to ONE of:
#   Apple Silicon: sudo cp nginx.demand-planning.ecosoulhometech.conf /opt/homebrew/etc/nginx/servers/demand-planning.ecosoulhometech.conf
#   Intel Mac:     sudo cp nginx.demand-planning.ecosoulhometech.conf /usr/local/etc/nginx/servers/demand-planning.ecosoulhometech.conf
#
# SSL paths use Apple Silicon Homebrew (/opt/homebrew). On Intel, replace every
# /opt/homebrew/etc/nginx with /usr/local/etc/nginx in this file (or after copy).
#
# TLS files (after Certbot — see MAC_STUDIO_ECOSOUL_DOMAIN_SETUP.md):
#   /opt/homebrew/etc/nginx/ssl/demand-planning.ecosoulhometech.com.crt
#   /opt/homebrew/etc/nginx/ssl/demand-planning.ecosoulhometech.com.key
#
# Ensure main nginx.conf includes:  include servers/*;

server {
    listen 80;
    server_name demand-planning.ecosoulhometech.com api.demand-planning.ecosoulhometech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name demand-planning.ecosoulhometech.com;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/demand-planning.ecosoulhometech.com.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/demand-planning.ecosoulhometech.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3000/_next/static;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    location /uploads {
        proxy_pass http://127.0.0.1:5002/uploads;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 502 "Application is currently unavailable. Please try again later.";
    }
}

server {
    listen 443 ssl http2;
    server_name api.demand-planning.ecosoulhometech.com;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/demand-planning.ecosoulhometech.com.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/demand-planning.ecosoulhometech.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    add_header 'Access-Control-Allow-Origin' 'https://demand-planning.ecosoulhometech.com' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://demand-planning.ecosoulhometech.com' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100M;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 502 "API is currently unavailable. Please try again later.";
    }
}
